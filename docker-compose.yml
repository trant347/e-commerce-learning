services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/logs
    restart: unless-stopped

  frontend:
    image: frontend
    ports:
    - "3000:3000"
    environment:
    - NODE_ENV=production
    depends_on:
      - product-service
  product-service:
    image: product-service
    environment:
    - spring.cloud.consul.enabled=true
    - LOGGING_LEVEL_COM_BOOKSTORE_PRODUCTSEVICE=DEBUG
    ports:
    - "8080:8080" #need to remove exposed port in production
    - "8000:8000" #debug port
    depends_on:
    - mongodb
    - consul
    - authentication-service


  calendar-service:
    image: calendar-service
    environment:
    - ConnectionsString=${ConnectionsString}
    - ConsulConfig__ConsulAddress=http://consul:8500
    - ConsulConfig__ServiceAddress=calendar-service # IMPORTANT: This is the service name *within* the Docker network
    - ConsulConfig__ServicePort=8080 # The port *your app listens on inside the container*
    - ConsulConfig__HealthCheckUrl=http://calendar-service:8080/health
    - KafkaProducerConfig__BootstrapServers=kafka:29092
    - KafkaProducerConfig__Topic=bookings
    - KafkaProducerConfig__NotificationTopic=notification-events
    - JwtSettings__Secret=JwtSecretKey
    - ExternalServices__ProductServiceBaseUrl=http://product-service:8080
    ports:
    - "8082:8080" #need to remove exposed port in production
    depends_on:
    - mongodb
    - consul
    - kafka


  authentication-service:
    image: auth-service
    environment:
    - spring.cloud.consul.enabled=true
    - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    ports:
    - "8081:8081" #need to remove exposed port in production
    - "8001:8000" #debug
    depends_on:
    - mongodb
    - consul
    - kafka

  mongodb:
    image: mongodb/mongodb-community-server:5.0-ubi8  
    ports:
    - "27017:27017"
    volumes:
    - mongodb-data:/data/db

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Explicitly disable KRaft mode
      KAFKA_PROCESS_ROLES: ""
      KAFKA_CONTROLLER_QUORUM_VOTERS: ""
      KAFKA_CONTROLLER_LISTENER_NAMES: ""
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    
  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Wait for Kafka to be ready
        cub kafka-ready -b kafka:9092 1 20
        # Create the 'bookings' topic
        kafka-topics --create --if-not-exists --topic bookings --partitions 1 --replication-factor 1 --bootstrap-server kafka:9092
        kafka-topics --create --if-not-exists --topic notification-events --partitions 1 --replication-factor 1 --bootstrap-server kafka:9092
        kafka-topics --create --if-not-exists --topic user-events --partitions 1 --replication-factor 1 --bootstrap-server kafka:9092
        echo "Topic created successfully."

  redis:
    image: redis:6.0.9
    ports:
    - "6379:6379"

  consul:
    image: consul:1.4.3
    hostname: consul
    environment:
      SERVICE_TAGS: dev,consul,consul_tag
    ports:
    - "8400:8400"             # CLI PRC
    - "8500:8500"             # HTTP API & Web UI
    - "8600:53"               # DNS interface
    command: "agent -dev -bootstrap=true -client 0.0.0.0 -ui"
    restart: always
  
  notification-service:
    image: notification-service:latest
    environment:
    - ConnectionsString=${ConnectionsString}
    - MongoBookingDatabaseName=${MongoBookingDatabaseName}
    - ConsulConfig__ConsulAddress=http://consul:8500
    - ConsulConfig__ServiceAddress=notification-service
    - ConsulConfig__ServicePort=8080
    - ConsulConfig__HealthCheckUrl=http://notification-service:8080/health
    - KafkaConsumerConfig__BootstrapServers=kafka:29092
    - KafkaConsumerConfig__GroupId=notification-service-group
    - KafkaConsumerConfig__Topic__0=notification-events
    ports:
    - "8084:8080"
    depends_on:
    - mongodb
    - kafka-init
    - kafka
    restart: unless-stopped

  worker-service:
    image: worker-service:latest
    environment:
    - ConnectionsString=${ConnectionsString}
    - MongoBookingDatabaseName=${MongoBookingDatabaseName}
    - ConsulConfig__ConsulAddress=http://consul:8500
    - ConsulConfig__ServiceAddress=worker-service
    - ConsulConfig__ServicePort=8080
    - ConsulConfig__HealthCheckUrl=http://worker-service:8080/health
    - Kafka__BootstrapServers=kafka:29092
    - Kafka__GroupId=worker-service-group
    - Kafka__Topics_0=bookings
    - Kafka__OutputTopics_0=notification-events
    ports:
    - "8085:8080"
    depends_on:
    - calendar-service
    - kafka
    - kafka-init
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
    - "11434:11434"
    volumes:
    - ollama-data:/root/.ollama
    restart: unless-stopped
    # Uncomment below for GPU support (requires nvidia-docker):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Init container to pull the model on first startup
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
    - ollama
    volumes:
    - ollama-data:/root/.ollama
    environment:
    - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
    - |
      echo "Waiting for Ollama server to be ready..."
      sleep 10
      echo "Pulling llama3.1:8b-instruct-q4_K_S model (this may take a few minutes)..."
      ollama pull llama3.1:8b-instruct-q4_K_S
      echo "Model pull complete!"
    restart: "no"

  ai-assistant-service:
    build:
      context: ./ai-assistant-service
      dockerfile: Dockerfile
    image: ai-assistant-service:latest
    environment:
    - Ollama__BaseUrl=http://ollama:11434
    - Ollama__Model=llama3.1:8b-instruct-q4_K_S
    - Ollama__TimeoutSeconds=180
    - ExternalServices__ProductServiceBaseUrl=http://product-service:8080
    - ExternalServices__BookingServiceBaseUrl=http://calendar-service:8080
    ports:
    - "8086:8080"
    depends_on:
    - product-service
    - calendar-service
    - ollama
    restart: unless-stopped

volumes:
  zookeeper-data:
  kafka-data:
  zookeeper-logs:
  ollama-data:
  mongodb-data: