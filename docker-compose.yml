services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/logs
    restart: unless-stopped

  frontend:
    image: frontend
    ports:
    - "3000:3000"
    environment:
    - NODE_ENV=production
    - OTEL_SDK_DISABLED=true
    # - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    # - OTEL_SERVICE_NAME=frontend
    depends_on:
      - product-service
      # - otel-collector
  product-service:
    image: product-service
    volumes:
    - product-static:/app/static
    environment:
    - spring.cloud.consul.enabled=true
    - LOGGING_LEVEL_COM_BOOKSTORE_PRODUCTSEVICE=DEBUG
    - SECURITY_JWT_SECRET=${JwtSecret:?JwtSecret must be set in .env and be at least 32 characters}
    - SPRING_DATA_MONGODB_HOST=mongo
    - SPRING_DATA_MONGODB_USERNAME=${PRODUCTS_DB_USER}
    - SPRING_DATA_MONGODB_PASSWORD=${PRODUCTS_DB_PASSWORD}
    - SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE=products
    - SPRING_DATA_REDIS_HOST=redis
    - OTEL_SDK_DISABLED=true
    # - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    # - OTEL_SERVICE_NAME=product-service
    - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
    ports:
    - "8080:8080" #need to remove exposed port in production
    - "8000:8000" #debug port
    depends_on:
    - mongo
    - consul
    - authentication-service
    - redis
    # - otel-collector


  calendar-service:
    image: calendar-service
    environment:
    - ConnectionsString=mongodb://${BOOKINGS_DB_USER}:${BOOKINGS_DB_PASSWORD}@mongo:27017/?authSource=BookingsDB
    - ConsulConfig__ConsulAddress=http://consul:8500
    - ConsulConfig__ServiceAddress=calendar-service # IMPORTANT: This is the service name *within* the Docker network
    - ConsulConfig__ServicePort=8080 # The port *your app listens on inside the container*
    - ConsulConfig__HealthCheckUrl=http://calendar-service:8080/health
    - KafkaProducerConfig__BootstrapServers=kafka:29092
    - KafkaProducerConfig__NotificationTopic=notification-events
    - JwtSettings__Secret=${JwtSecret:?JwtSecret must be set in .env and be at least 32 characters}
    - ExternalServices__ProductServiceBaseUrl=http://product-service:8080
    - OTEL_SDK_DISABLED=true
    # - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    # - OTEL_SERVICE_NAME=calendar-service
    ports:
    - "8082:8080" #need to remove exposed port in production
    depends_on:
    - mongo
    - consul
    - kafka
    # - otel-collector


  authentication-service:
    image: auth-service
    environment:
    - spring.cloud.consul.enabled=true
    - SECURITY_JWT_SECRET=${JwtSecret:?JwtSecret must be set in .env and be at least 32 characters}
    - SPRING_DATA_MONGODB_HOST=mongo
    - SPRING_DATA_MONGODB_USERNAME=${AUTH_DB_USER}
    - SPRING_DATA_MONGODB_PASSWORD=${AUTH_DB_PASSWORD}
    - SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE=user
    - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    - OTEL_SDK_DISABLED=true
    # - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    # - OTEL_SERVICE_NAME=authorization-service
    - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
    ports:
    - "8081:8081" #need to remove exposed port in production
    - "8001:8000" #debug
    depends_on:
    - mongo
    - consul
    - kafka
    # - otel-collector

  mongo:
    image: mongodb/mongodb-community-server:7.0-ubi8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      PRODUCTS_DB_USER: ${PRODUCTS_DB_USER}
      PRODUCTS_DB_PASSWORD: ${PRODUCTS_DB_PASSWORD}
      BOOKINGS_DB_USER: ${BOOKINGS_DB_USER}
      BOOKINGS_DB_PASSWORD: ${BOOKINGS_DB_PASSWORD}
      NOTIFICATIONS_DB_USER: ${NOTIFICATIONS_DB_USER}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD}
    ports:
    - "27017:27017"
    volumes:
    - mongo-data:/data/db
    - ./mongo-init/auth-init.js:/docker-entrypoint-initdb.d/auth-init.js:ro
    - ./mongo-init/products-init.js:/docker-entrypoint-initdb.d/products-init.js:ro
    - ./mongo-init/bookings-init.js:/docker-entrypoint-initdb.d/bookings-init.js:ro
    - ./mongo-init/notifications-init.js:/docker-entrypoint-initdb.d/notifications-init.js:ro
    restart: unless-stopped

  postgres-payments:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PAYMENTS_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD}
      POSTGRES_DB: paymentdb
    ports:
    - "5432:5432"
    volumes:
    - postgres-payments-data:/var/lib/postgresql/data
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Explicitly disable KRaft mode
      KAFKA_PROCESS_ROLES: ""
      KAFKA_CONTROLLER_QUORUM_VOTERS: ""
      KAFKA_CONTROLLER_LISTENER_NAMES: ""
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    
  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Wait for Kafka to be ready
        cub kafka-ready -b kafka:9092 1 20
        # Create the 'bookings' topic
        kafka-topics --create --if-not-exists --topic notification-events --partitions 1 --replication-factor 1 --bootstrap-server kafka:9092
        kafka-topics --create --if-not-exists --topic user-events --partitions 1 --replication-factor 1 --bootstrap-server kafka:9092
        echo "Topic created successfully."

  redis:
    image: redis:6.0.9
    ports:
    - "6379:6379"

  consul:
    image: consul:1.4.3
    hostname: consul
    environment:
      SERVICE_TAGS: dev,consul,consul_tag
    ports:
    - "8400:8400"             # CLI PRC
    - "8500:8500"             # HTTP API & Web UI
    - "8600:53"               # DNS interface
    command: "agent -dev -bootstrap=true -client 0.0.0.0 -ui"
    restart: always
  
  notification-service:
    image: notification-service:latest
    environment:
    - ConnectionStrings__MongoDB=mongodb://${NOTIFICATIONS_DB_USER}:${NOTIFICATIONS_DB_PASSWORD}@mongo:27017/NotificationDB?authSource=NotificationDB
    - ConsulConfig__ConsulAddress=http://consul:8500
    - ConsulConfig__ServiceAddress=notification-service
    - ConsulConfig__ServicePort=8080
    - ConsulConfig__HealthCheckUrl=http://notification-service:8080/health
    - KafkaConsumerConfig__BootstrapServers=kafka:29092
    - KafkaConsumerConfig__GroupId=notification-service-group
    - KafkaConsumerConfig__Topic__0=notification-events
    - OTEL_SDK_DISABLED=true
    # - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    # - OTEL_SERVICE_NAME=notification-service
    ports:
    - "8084:8080"
    depends_on:
    - mongo
    - kafka-init
    - kafka
    # - otel-collector
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    image: payment-service:latest
    environment:
    - ConnectionStrings__Postgres=Host=postgres-payments;Port=5432;Database=paymentdb;Username=${PAYMENTS_DB_USER};Password=${PAYMENTS_DB_PASSWORD}
    - ConsulConfig__ConsulAddress=http://consul:8500
    - ConsulConfig__ServiceAddress=payment-service # IMPORTANT: This is the service name *within* the Docker network
    - ConsulConfig__ServicePort=8080 # The port *your app listens on inside the container*
    - ConsulConfig__HealthCheckUrl=http://payment-service:8080/health
    - KafkaConsumerConfig__BootstrapServers=kafka:29092
    - OTEL_SDK_DISABLED=true
    # - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    # - OTEL_SERVICE_NAME=payment-service
    ports:
    - "8085:8080" #need to remove exposed port in production
    depends_on:
    - postgres-payments
    - consul
    - kafka-init
    - kafka
    # - otel-collector
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
    - "11434:11434"
    volumes:
    - ollama-data:/root/.ollama
    restart: unless-stopped
    # Uncomment below for GPU support (requires nvidia-docker):
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Init container to pull the model on first startup
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
    - ollama
    volumes:
    - ollama-data:/root/.ollama
    environment:
    - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
    - |
      echo "Waiting for Ollama server to be ready..."
      sleep 10
      echo "Pulling qwen2.5:7b-instruct model (this may take a few minutes)..."
      ollama pull qwen2.5:7b-instruct
      echo "Model pull complete!"
    restart: "no"

  ai-assistant-service:
    build:
      context: ./ai-assistant-service
      dockerfile: Dockerfile
    image: ai-assistant-service:latest
    environment:
    - Ollama__BaseUrl=http://ollama:11434
    - Ollama__Model=qwen2.5:7b-instruct
    - Ollama__TimeoutSeconds=600
    - ExternalServices__ProductServiceBaseUrl=http://product-service:8080
    - ExternalServices__BookingServiceBaseUrl=http://calendar-service:8080
    - Redis__ConnectionString=redis:6379
    - OTEL_SDK_DISABLED=true
    # - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    # - OTEL_SERVICE_NAME=ai-assistant-service
    ports:
    - "8086:8080"
    depends_on:
    - product-service
    - calendar-service
    - ollama
    - redis
    # - otel-collector
    restart: unless-stopped

  # ─── Observability Stack (disabled to save memory) ───
