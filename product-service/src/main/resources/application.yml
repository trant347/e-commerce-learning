spring:
  config:
    # Spring Boot 3 ignores bootstrap.yml without spring-cloud-starter-bootstrap.
    # Declaring consul as an *optional* config source lets the app start even when
    # Consul is unreachable, while still pulling shared config when it is.
    import: "optional:consul:"
  cloud:
    consul:
      host: ${CONSUL_SERVER:consul}
      port: ${CONSUL_PORT:8500}
      discovery:
        service-name: ${spring.application.name}
      config:
        enabled: ${SPRING_CLOUD_CONSUL_ENABLED:true}
    bus:
      enabled: ${SPRING_CLOUD_CONSUL_ENABLED:true}
  data:
    mongodb:
      port: ${mongo_port:27017}
      host: mongodb
      database: products
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  application:
    name: product-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: product-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    template:
      observation-enabled: true
    listener:
      observation-enabled: true


logging:
  level:
    org.springframework.cloud.consul: INFO
server:
  port: 8080

management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/traces
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/metrics
        step: 30s
