name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  authorization-service-tests:
    name: authorization-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authorization-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Run tests
        run: mvn -B --no-transfer-progress test

  product-service-tests:
    name: product-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      # BookServiceApplicationTests is really an integration test (Spring Boot + Mongo via
      # Testcontainers 1.8.0). Testcontainers 1.8.0 hardcodes a pull of
      # quay.io/testcontainers/ryuk:0.2.2 which is no longer available, and the
      # TESTCONTAINERS_RYUK_DISABLED env var only works on 1.10+. Skip the integration
      # test in CI; the pure unit tests still run.
      - name: Run unit tests
        run: mvn -B --no-transfer-progress test -Dtest='!BookServiceApplicationTests'

  calendar-service-tests:
    name: calendar-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendar-service.Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore --nologo --verbosity normal

