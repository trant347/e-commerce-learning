name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  authorization-service-tests:
    name: authorization-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authorization-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run tests
        run: mvn -B --no-transfer-progress test

  product-service-tests:
    name: product-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run tests
        run: mvn -B --no-transfer-progress test

  calendar-service-tests:
    name: calendar-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendar-service.Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore --nologo --verbosity normal

