name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  authorization-service-tests:
    name: authorization-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authorization-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Run tests
        run: mvn -B --no-transfer-progress test

  product-service-tests:
    name: product-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product-service
    env:
      # Testcontainers 1.8.0 references quay.io/testcontainers/ryuk:0.2.2 which is no longer
      # available. Ryuk only matters on long-lived dev machines; CI runners are ephemeral.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Run tests
        run: mvn -B --no-transfer-progress test
