spring:
  application:
    name: "authentication-service"
  data:
    mongodb:
      port: ${mongo_port:27017}
      database: user
      host: mongodb
  consul:
    discovery:
      serviceName: ${spring.application.name}
      instanceId:  ${spring.application.name}
  mvc:
    view:
      suffix: .html
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    template:
      observation-enabled: true
server:
  port: 8081
  servlet:
    context-path: /
jwt:
  get.token.uri: /authenticate
  http.request.header: Authorization
management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/traces
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/metrics
        step: 30s